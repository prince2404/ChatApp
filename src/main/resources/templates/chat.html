<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:             #0d1117;
            --card-bg:        #161b22;
            --nav-bg:         #1c2128;
            --input-bg:       #21262d;
            --bubble-me:      #5865f2;
            --bubble-me-dark: #4752c4;
            --bubble-other:   #2d333b;
            --border:         rgba(255,255,255,0.08);
            --text:           #e6edf3;
            --text-muted:     #8b949e;
            --placeholder:    #484f58;
            --green:          #3fb950;
            --red:            #f85149;
            --accent:         #388bfd;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow: hidden;
        }

        .chat-card {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 24px 64px rgba(0,0,0,0.55);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── LOBBY SCREEN ── */
        #lobbyScreen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .lobby-box {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .lobby-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .lobby-input:focus {
            border-color: var(--bubble-me);
        }

        #roomIdInput {
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .join-wrapper {
            display: flex;
            flex-direction: column;
        }

        .error-msg {
            color: var(--red);
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 2px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn-create {
            background: var(--bubble-me);
            color: #fff;
        }

        .btn-create:hover {
            background: var(--bubble-me-dark);
        }

        .btn-join {
            background: var(--nav-bg);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-join:hover {
            background: rgba(255,255,255,0.08);
        }

        /* ── CHAT SCREEN ── */
        #chatScreen {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-navbar {
            background: var(--nav-bg);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .room-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #a5b4fc;
            letter-spacing: 1px;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .copy-btn:hover {
            color: var(--text);
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
        }

        .leave-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .leave-btn:hover {
            background: rgba(248,81,73,0.15);
            border-color: rgba(248,81,73,0.4);
            color: var(--red);
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #chatMessages::-webkit-scrollbar { width: 4px; }
        #chatMessages::-webkit-scrollbar-track { background: transparent; }
        #chatMessages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .msg-me { align-self: flex-end; align-items: flex-end; }
        .msg-other { align-self: flex-start; align-items: flex-start; }

        .bubble {
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-me .bubble {
            background: var(--bubble-me);
            color: #fff;
            border-bottom-right-radius: 3px;
        }

        .msg-other .bubble {
            background: var(--bubble-other);
            color: var(--text);
            border-bottom-left-radius: 3px;
        }

        .bubble-sender {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #a5b4fc;
            margin-bottom: 2px;
        }

        .bubble-time {
            display: block;
            font-size: 10px;
            margin-top: 4px;
            text-align: right;
            opacity: 0.6;
        }

        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--bubble-me);
        }

        .btn-send {
            background: var(--bubble-me);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover {
            background: var(--bubble-me-dark);
        }
    </style>
</head>
<body>

<div class="chat-card">

    <!-- Lobby Screen -->
    <div id="lobbyScreen">
        <div class="lobby-box">
            <input type="text" id="nameInput" class="lobby-input" autocomplete="name" />
            <div class="join-wrapper">
                <input type="text" id="roomIdInput" class="lobby-input" maxlength="6" autocomplete="off" />
                <span id="joinError" class="error-msg">Room not found</span>
            </div>
            <div class="btn-group">
                <button type="button" id="btnCreate" class="btn btn-create" onclick="handleCreate()">Create</button>
                <button type="button" id="btnJoin" class="btn btn-join" onclick="handleJoin()">Join</button>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chatScreen">
        <div class="chat-navbar">
            <div class="room-tag">
                <span id="roomDisplay"></span>
                <button type="button" class="copy-btn" onclick="copyRoomId()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
            <button type="button" class="leave-btn" onclick="leaveChat()">Leave</button>
        </div>

        <div id="chatMessages"></div>

        <div class="chat-input-bar">
            <input type="text" id="messageInput" class="chat-input" autocomplete="off" />
            <button type="button" id="sendMessage" class="btn-send" onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
    var stompClient = null;
    var currentRoomId = null;
    var currentUserName = "";
    var roomSubscription = null;

    var nameInput = document.getElementById("nameInput");
    var roomIdInput = document.getElementById("roomIdInput");
    var joinError = document.getElementById("joinError");
    var lobbyScreen = document.getElementById("lobbyScreen");
    var chatScreen = document.getElementById("chatScreen");
    var roomDisplay = document.getElementById("roomDisplay");
    var chatMessages = document.getElementById("chatMessages");
    var messageInput = document.getElementById("messageInput");

    // Hide error as soon as user edits the room ID
    roomIdInput.addEventListener("input", function() {
        joinError.style.display = "none";
    });

    // Format HH:MM timestamp
    function formatTime(ts) {
        var d = ts ? new Date(ts) : new Date();
        return isNaN(d.getTime())
            ? ""
            : d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
    }

    // CREATE: generates random 6-char room ID, saves to MongoDB, enters chat automatically
    function handleCreate() {
        currentUserName = nameInput.value.trim();
        fetch('/api/room/create')
            .then(function(res) {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(function(data) {
                enterChat(data.roomId);
            })
            .catch(function(err) {
                console.error(err);
            });
    }

    // JOIN: checks if room ID exists in MongoDB; if yes enters, if no shows small red error text
    function handleJoin() {
        currentUserName = nameInput.value.trim();
        var code = roomIdInput.value.trim().toUpperCase();
        if (!code) {
            joinError.style.display = "block";
            return;
        }

        fetch('/api/room/check/' + encodeURIComponent(code))
            .then(function(res) {
                if (res.ok) {
                    return res.json();
                }
                throw new Error();
            })
            .then(function(data) {
                if (data.exists) {
                    joinError.style.display = "none";
                    enterChat(code);
                } else {
                    joinError.style.display = "block";
                }
            })
            .catch(function() {
                joinError.style.display = "block";
            });
    }

    // Transition into room chat view
    function enterChat(roomId) {
        currentRoomId = roomId.toUpperCase();
        roomDisplay.textContent = currentRoomId;
        chatMessages.innerHTML = "";

        lobbyScreen.style.display = "none";
        chatScreen.style.display = "flex";

        connectWebSocket(currentRoomId);
        loadHistory(currentRoomId);
    }

    // Connects STOMP client and isolates subscriptions per room
    function connectWebSocket(roomId) {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function() {
            // Subscribe strictly to messages for this room
            roomSubscription = stompClient.subscribe('/topic/' + roomId, function(frame) {
                var message = JSON.parse(frame.body);
                appendMessage(message);
            });
        });
    }

    // Fetch previous 50 messages from MongoDB for this room
    function loadHistory(roomId) {
        fetch('/api/messages/' + encodeURIComponent(roomId))
            .then(function(res) {
                return res.json();
            })
            .then(function(messages) {
                if (Array.isArray(messages)) {
                    messages.forEach(function(msg) {
                        appendMessage(msg);
                    });
                }
            })
            .catch(function(err) {
                console.error(err);
            });
    }

    // Render individual message bubble
    function appendMessage(msg) {
        var isMe = currentUserName !== "" && msg.sender === currentUserName;
        var row = document.createElement("div");
        row.className = "msg-row " + (isMe ? "msg-me" : "msg-other");

        var bubble = document.createElement("div");
        bubble.className = "bubble";

        if (!isMe && msg.sender) {
            var sender = document.createElement("span");
            sender.className = "bubble-sender";
            sender.textContent = msg.sender;
            bubble.appendChild(sender);
        }

        var text = document.createElement("span");
        text.textContent = msg.content;
        bubble.appendChild(text);

        var time = document.createElement("span");
        time.className = "bubble-time";
        time.textContent = formatTime(msg.timestamp);
        bubble.appendChild(time);

        row.appendChild(bubble);
        chatMessages.appendChild(row);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Sends message isolated to /app/chat/{roomId}
    function sendMessage() {
        var text = messageInput.value.trim();
        if (!text || !stompClient || !stompClient.connected) return;

        var payload = {
            sender: currentUserName || "Anonymous",
            content: text,
            roomId: currentRoomId
        };

        stompClient.send('/app/chat/' + currentRoomId, {}, JSON.stringify(payload));
        messageInput.value = "";
        messageInput.focus();
    }

    // Copies room ID to clipboard
    function copyRoomId() {
        if (!currentRoomId) return;
        navigator.clipboard.writeText(currentRoomId);
    }

    // Disconnects and navigates back to lobby
    function leaveChat() {
        if (roomSubscription) {
            roomSubscription.unsubscribe();
            roomSubscription = null;
        }
        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
            stompClient = null;
        }

        currentRoomId = null;
        chatMessages.innerHTML = "";
        roomIdInput.value = "";
        joinError.style.display = "none";

        chatScreen.style.display = "none";
        lobbyScreen.style.display = "flex";
    }

    // Keydown handlers for Enter key
    messageInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") sendMessage();
    });

    roomIdInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") handleJoin();
    });

    nameInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            if (roomIdInput.value.trim()) {
                handleJoin();
            } else {
                handleCreate();
            }
        }
    });
</script>

</body>
</html>
